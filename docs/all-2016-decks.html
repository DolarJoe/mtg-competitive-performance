let sortKey = 'o', sortDir = -1, section = 'main', hideBasics = true, query = '';

function value(c, k) {
  if (k === 'p') return section === 'main' ? c.md / DATA.n : c.sd / DATA.n;
  if (k === 'n' || k === 'ar') return c[k];
  if (section === 'both') { if (k === 'o') return c.o; if (k === 'd') return c.d; }

function visible() {
